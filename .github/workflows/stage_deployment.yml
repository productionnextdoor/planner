name: STAGE Deployment

on:
  push:
    paths:
      - 'src/**'
      - 'requirements.txt'
    branches:
      - 'stage'
  workflow_dispatch:


jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      BACKUP_TAG: ${{ github.event_name != 'workflow_dispatch' && github.run_number || github.sha }}
    steps:
      - name: Checking out the repo
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.flask
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pm-hsu-planner:stage
            ghcr.io/${{ github.repository_owner }}/pm-hsu-planner:stage-${{ env.BACKUP_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

