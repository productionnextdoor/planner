name: STAGE Deployment

on:
  push:
    paths:
      - 'src/**'
      - 'requirements.txt'
    branches:
      - 'stage'
  workflow_dispatch:


jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      BACKUP_TAG: ${{ github.event_name != 'workflow_dispatch' && github.run_number || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: docker build -f ./Dockerfile.flask -t ghcr.io/${{ github.repository_owner }}/pm-hsu-planner:stage -t ghcr.io/${{ github.repository_owner }}/pm-hsu-planner:stage-${{ env.BACKUP_TAG }} .

      - name: Push Docker images
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/pm-hsu-planner:stage
          docker push ghcr.io/${{ github.repository_owner }}/pm-hsu-planner:stage-${{ env.BACKUP_TAG }}

